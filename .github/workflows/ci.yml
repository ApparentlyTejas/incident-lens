name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest   # Linux x86_64: scripts/start_serenedb.sh takes the native-binary path, no Docker needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy server

      - name: Start SereneDB and load sample data
        run: ./scripts/setup.sh --sample

      - name: Run test suite with coverage
        run: >
          pytest -q --asyncio-mode=auto
          --cov=server --cov-report=term-missing --cov-report=xml --cov-report=html
          tests

      - name: stdio smoke test
        run: python3 tests/stdio_smoke.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
